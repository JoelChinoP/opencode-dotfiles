id = "opencode-dotfiles.file-links"
name = "Local file links"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Reveal local files in the desktop file manager on Ctrl-click"
platforms = ["linux"]

[[actions]]
id = "reveal"
title = "Mostrar archivo en el explorador"
contexts = ["workspace"]
command = ["sh", "reveal.sh"]

[[link_handlers]]
id = "local-file"
title = "Mostrar archivo local"
pattern = "^file://(/|localhost/)"
action = "reveal"
